<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Connexion — Des personnes. Des affinités. Une connexion choisie.">
    <title>Connexion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="phone-shell">
      <header class="status-bar" aria-label="État du téléphone">
        <div class="status-left">10:20</div>
        <div class="status-center">◔</div>
        <div class="status-right">
          <span>5G</span>
          <span>▣</span>
          <span>◍</span>
        </div>
      </header>

      <main class="screen-stack" aria-live="polite">
        <section class="slide is-active" aria-label="Écran 1">
          <img src="images/hero.png" alt="Écran d'accueil Connexion">
        </section>
        <section class="slide" aria-label="Écran 2">
          <img src="images/hero1.png" alt="Section des intentions Connexion">
        </section>
        <section class="slide" aria-label="Écran 3">
          <img src="images/hero2.png" alt="Écran Connexion 2">
        </section>
        <section class="slide" aria-label="Écran 4">
          <img src="images/hero3.png" alt="Écran Connexion 3">
        </section>
        <section class="slide" aria-label="Écran 5">
          <img src="images/hero4.png" alt="Écran Connexion 4">
        </section>
        <section class="slide" aria-label="Écran 6">
          <img src="images/hero5.png" alt="Écran Connexion 5">
        </section>
        <section class="slide" aria-label="Écran 7">
          <img src="images/hero6.png" alt="Écran Connexion 6">
        </section>
        <section class="slide" aria-label="Écran 8">
          <img src="images/hero7.png" alt="Écran Connexion 7">
        </section>
      </main>

      <div class="screen-controls" aria-label="Contrôles de navigation">
        <button class="nav-btn" data-action="prev" aria-label="Écran précédent">←</button>
        <button class="nav-btn" data-action="next" aria-label="Écran suivant">→</button>
      </div>

      <div class="dots" aria-label="Pagination des écrans">
        <button class="dot is-active" data-index="0" aria-label="Aller à l'écran 1"></button>
        <button class="dot" data-index="1" aria-label="Aller à l'écran 2"></button>
        <button class="dot" data-index="2" aria-label="Aller à l'écran 3"></button>
        <button class="dot" data-index="3" aria-label="Aller à l'écran 4"></button>
        <button class="dot" data-index="4" aria-label="Aller à l'écran 5"></button>
        <button class="dot" data-index="5" aria-label="Aller à l'écran 6"></button>
        <button class="dot" data-index="6" aria-label="Aller à l'écran 7"></button>
        <button class="dot" data-index="7" aria-label="Aller à l'écran 8"></button>
      </div>

      <nav class="bottom-nav" aria-label="Navigation de l'application">
        <button class="bottom-btn" aria-label="Accueil">⌂</button>
        <button class="bottom-btn" aria-label="Fermer">✕</button>
        <button class="bottom-btn url-pill" aria-label="Adresse du site">danie-11.github.io</button>
        <button class="bottom-btn" aria-label="Ajouter">＋</button>
        <button class="bottom-btn" aria-label="Menu">⋮</button>
      </nav>
    </div>

    <script src="script.js"></script>
  </body>
</html>
